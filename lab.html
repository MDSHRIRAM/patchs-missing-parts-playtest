    <script>
      // Starts the big downloads at once, in parallel with the JavaScript (the module waits for its chunks first).
      // Also drives the loading bar until the game takes over. No imports, runs during HTML parsing.
      (function () {
        var parts = { js: 0, havok: 0, patch: 0, room: 0, collision: 0, ready: 0 };
        var weight = { js: 0.3, havok: 0.17, patch: 0.15, room: 0.2, collision: 0.02, ready: 0.16 };
        var t0 = performance.now();
        function draw() {
          var sum = 0;
          for (var k in weight) sum += weight[k] * Math.min(1, parts[k]);
          var el = document.getElementById('barFill');
          if (el) el.style.width = (sum * 100).toFixed(1) + '%';
        }
        window.__progress = function (k, v, label) {
          parts[k] = v;
          if (label) { var s = document.getElementById('loadStep'); if (s) s.textContent = label; }
          draw();
        };
        (function creep() { // the JavaScript download cannot report progress: creep toward its share
          if (parts.js >= 1) return;
          parts.js = Math.min(0.9, (performance.now() - t0) / 2500);
          draw();
          requestAnimationFrame(creep);
        })();
        function grab(url, key, asJson) {
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error(url + ' ' + r.status);
            var total = Number(r.headers.get('Content-Length')) || 0;
            if (!r.body || !total || asJson) return asJson ? r.json() : r.arrayBuffer();
            var reader = r.body.getReader(), chunks = [], got = 0;
            return (function pump() {
              return reader.read().then(function (x) {
                if (x.done) {
                  var out = new Uint8Array(got), o = 0;
                  for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
                  return out.buffer;
                }
                chunks.push(x.value); got += x.value.length;
                window.__progress(key, 0.95 * got / total);
                return pump();
              });
            })();
          }).then(function (v) { window.__progress(key, 1); return v; });
        }
        var room = new URLSearchParams(location.search).get('level') !== 'grey';
        window.__early = {
          havok: grab('./physics/HavokPhysics.wasm', 'havok'),
          patch: grab('./models/patch.glb', 'patch'),
          room: room ? grab('./models/room/room.glb', 'room') : null,
          collision: room ? grab('./models/room/room_collision.json', 'collision', true) : null,
        };
        if (!room) { parts.room = 1; parts.collision = 1; }
      })();
    </script>

content:center;align-items:center;font-weight:800;display:none;position:fixed;box-shadow:0 4px #0d484fcc}.round.down{transform:translateY(3px);box-shadow:0 1px #0d484fcc}#jumpBtn{right:max(26px, env(safe-area-inset-right));bottom:max(28px, env(safe-area-inset-bottom));background:var(--coral);width:92px;height:92px;font-size:18px}#partsBtn{right:max(130px, calc(env(safe-area-inset-right) + 112px));bottom:max(22px, env(safe-area-inset-bottom));background:var(--teal);width:68px;height:68px;font-size:14px}body.touch #stickZone,body.touch .round{display:flex}#loading{color:#3b2a4a;z-index:10;background:#f3e3c8;flex-direction:column;justify-content:center;align-items:center;gap:14px;transition:opacity .35s;display:flex;position:fixed;inset:0}#loading.hidden{opacity:0;pointer-events:none}#loading h1{color:#1e7c86;margin:0;font-size:clamp(22px,5vw,36px)}#bar{background:#fff6e6;border-radius:12px;width:min(420px,70vw);height:22px;position:relative;overflow:hidden;box-shadow:inset 0 2px #3b2a4a26}#barFill{background:#1e7c86;border-radius:12px;width:0%;height:100%;transition:width .2s}#bar:after{content:"";border-top:2px dashed #fff6e6cc;position:absolute;top:50%;left:8px;right:8px}#loadStep{font-size:14px;font-weight:700}@media (max-height:500px){.chip{padding:3px 8px;font-size:11px}#profile{top:32px}}</style>
