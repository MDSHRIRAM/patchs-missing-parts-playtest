    <script>
      // Starts the big downloads at once, in parallel with the JavaScript (the module waits for its chunks first).
      // Also drives the loading bar until the game takes over. No imports, runs during HTML parsing.
      (function () {
        var parts = { js: 0, havok: 0, patch: 0, room: 0, collision: 0, ready: 0 };
        var weight = { js: 0.3, havok: 0.17, patch: 0.15, room: 0.2, collision: 0.02, ready: 0.16 };
        var t0 = performance.now();
        function draw() {
          var sum = 0;
          for (var k in weight) sum += weight[k] * Math.min(1, parts[k]);
          var el = document.getElementById('barFill');
          if (el) el.style.width = (sum * 100).toFixed(1) + '%';
        }
        window.__progress = function (k, v, label) {
          parts[k] = v;
          if (label) { var s = document.getElementById('loadStep'); if (s) s.textContent = label; }
          draw();
        };
        (function creep() { // the JavaScript download cannot report progress: creep toward its share
          if (parts.js >= 1) return;
          parts.js = Math.min(0.9, (performance.now() - t0) / 2500);
          draw();
          requestAnimationFrame(creep);
        })();
        function grab(url, key, asJson) {
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error(url + ' ' + r.status);
            var total = Number(r.headers.get('Content-Length')) || 0;
            if (!r.body || !total || asJson) return asJson ? r.json() : r.arrayBuffer();
            var reader = r.body.getReader(), chunks = [], got = 0;
            return (function pump() {
              return reader.read().then(function (x) {
                if (x.done) {
                  var out = new Uint8Array(got), o = 0;
                  for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], o); o += chunks[i].length; }
                  return out.buffer;
                }
                chunks.push(x.value); got += x.value.length;
                window.__progress(key, 0.95 * got / total);
                return pump();
              });
            })();
          }).then(function (v) { window.__progress(key, 1); return v; });
        }
        var room = new URLSearchParams(location.search).get('level') !== 'grey';
        window.__early = {
          havok: grab('./physics/HavokPhysics.wasm', 'havok'),
          patch: grab('./models/patch.glb', 'patch'),
          room: room ? grab('./models/room/room.glb', 'room') : null,
          collision: room ? grab('./models/room/room_collision.json', 'collision', true) : null,
        };
        if (!room) { parts.room = 1; parts.collision = 1; }
      })();
    </script>

x(12px, env(safe-area-inset-left));touch-action:none;background:linear-gradient(#3b2a4a00,#3b2a4a61);justify-content:center;align-items:flex-end;gap:10px;display:flex;position:absolute;bottom:0;left:0;right:0;overflow-x:auto}.card{box-sizing:border-box;background:var(--cream);touch-action:none;cursor:grab;border:3px dashed #1e7c8680;border-radius:16px;flex-direction:column;flex:none;justify-content:center;align-items:center;gap:2px;width:92px;height:108px;display:flex;box-shadow:0 4px #3b2a4a4d}.card img{pointer-events:none;width:74px;height:74px}.card b{text-align:center;padding:0 4px;font-size:11px;line-height:1.1}.card.fresh{border:3px solid var(--coral);animation:.9s ease-in-out infinite alternate cardBob}.card.lifted{opacity:.35}.card.picked{border:3px solid var(--coral);transform:translateY(-6px)}.ownIcon{background:radial-gradient(circle, #f2c7a5 0 46%, #f6e7cc 47% 62%, var(--teal) 63%);border-radius:50%;width:56px;height:56px;margin:9px 0}@keyframes cardBob{to{transform:translateY(-6px)}}.ring{box-sizing:border-box;pointer-events:auto;touch-action:none;border:3px dashed var(--cream);background:#1e7c8633;border-radius:50%;width:58px;height:58px;animation:1.3s ease-in-out infinite alternate ringGlow;position:absolute;top:-29px;left:-29px}.ring i{background:radial-gradient(circle at 34% 34%, var(--cream) 0 2px, transparent 2.6px), radial-gradient(circle at 66% 34%, var(--cream) 0 2px, transparent 2.6px), radial-gradient(circle at 34% 66%, var(--cream) 0 2px, transparent 2.6px), radial-gradient(circle at 66% 66%, var(--cream) 0 2px, transparent 2.6px), var(--teal);border-radius:50%;width:22px;height:22px;margin:-11px;transition:transform .12s;position:absolute;top:50%;left:50%;box-shadow:0 2px #0d484f99}.ring.worn{cursor:grab;background:#1e7c8614}.ring.worn i{width:16px;height:16px;margin:-8px}.ring.hot{box-shadow:0 0 0 4px var(--coral), 0 0 26px 10px #d9553f8c;border-style:solid;animation:none}.ring.hot i{transform:scale(1.35)}.ring.snap{animation:.45s ease-out
