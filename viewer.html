<!doctype html>
<html lang="en">
  <head>
<meta name="robots" content="noindex,nofollow">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Patch - Character Viewer</title>
    <link rel="icon" href="data:," />
    <style>:root{--cream:#fff6e6;--plum:#3b2a4a;--teal:#1e7c86;--teal-dark:#0d484f}html,body{background:#a9c3c6;height:100%;margin:0;overflow:hidden}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;color:var(--plum);font-family:Trebuchet MS,Segoe UI,system-ui,sans-serif}canvas{touch-action:none;outline:none;width:100vw;height:100vh;display:block}.panel{background:#fff6e6eb;border-radius:14px;padding:6px;position:fixed;box-shadow:0 3px #3b2a4a38}#anims{left:max(8px, env(safe-area-inset-left));flex-direction:column;gap:3px;max-height:calc(100vh - 70px);display:flex;top:50%;overflow-y:auto;transform:translateY(-50%)}#faces{left:50%;bottom:max(8px, env(safe-area-inset-bottom));flex-wrap:wrap;justify-content:center;gap:4px;max-width:calc(100vw - 190px);display:flex;transform:translate(-50%)}button{font:inherit;color:var(--plum);cursor:pointer;white-space:nowrap;background:#fff;border:2px solid #0000;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}button:hover{border-color:var(--teal)}button.on{background:var(--teal);color:var(--cream)}#parts{right:max(8px, env(safe-area-inset-right));flex-direction:column;gap:4px;display:flex;top:50px}#parts .row{align-items:center;gap:3px;display:flex}#parts .row span{width:62px;font-size:12px;font-weight:800}#quality{right:max(8px, env(safe-area-inset-right));position:fixed;top:8px}#stats{background:#fff6e6d9;border-radius:8px;padding:3px 7px;font:11px/1.2 monospace;position:fixed;top:8px;left:8px}#hint{right:max(8px, env(safe-area-inset-right));background:#fff6e6d9;border-radius:8px;padding:4px 8px;font-size:12px;position:fixed;bottom:10px}#loading{background:#a9c3c6;justify-content:center;align-items:center;font-size:22px;font-weight:800;transition:opacity .3s;display:flex;position:fixed;inset:0}#loading.hidden{opacity:0;pointer-events:none}@media (max-height:500px){button{border-radius:8px;padding:2px 7px;font-size:11px}#anims{gap:2px}#hint{display:none}#parts{gap:2px;top:40px}#parts .row span{width:48px;font-size:10px}}</style>
    <script type="module" crossorigin src="./assets/viewer-FHIQ1zr6.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/babylon-DLDz6N1G.js">
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="./assets/timestep-EYcmHLkq.js">
    <link rel="modulepreload" crossorigin href="./assets/felt-_1_eZFJr.js">
    <link rel="modulepreload" crossorigin href="./assets/patchModel-WRaLhRmL.js">
    <link rel="modulepreload" crossorigin href="./assets/partKit-DU-Z9w0E.js">
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="stats"></div>
    <div id="anims" class="panel"></div>
    <div id="faces" class="panel"></div>
    <div id="parts" class="panel"></div>
    <button id="quality">Quality</button>
    <div id="hint">Drag to orbit · Wheel or pinch to zoom</div>
    <div id="loading">Stitching Patch together...</div>
    <script>
      window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
  </body>
</html>
